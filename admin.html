<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선생님 미션 관리</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">✳ 우리 반 창작 스튜디오</a><a href="index.html">학생 화면 ↗</a></header><main class="admin"><span class="eyebrow">TEACHER'S DESK</span><h1>미션 관리</h1><p>미션을 편집하고 저장한 뒤, 학생용 파일을 GitHub에 올려 공유하세요.</p><p id="status" role="status" aria-live="polite"></p><form id="login" hidden><label>비밀번호<input id="password" type="password" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" required></label><button>교사 설정 들어가기</button></form><section id="editor" hidden><div class="toolbar"><button id="add">＋ 미션 추가</button><button id="save">이 브라우저에 저장</button><button id="export" class="secondary">학생용 파일 내려받기</button><button id="logout" class="secondary">로그아웃</button></div><p id="save-state">저장된 상태입니다.</p><div id="rows"></div></section></main><script type="module" src="admin.js"></script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선생님 미션 관리</title><link rel="stylesheet" href="style.css"></head><body><header><a class="brand" href="index.html">✳ 우리 반 창작 스튜디오</a><a href="index.html">학생 화면 ↗</a></header><main class="admin"><span class="eyebrow">TEACHER'S DESK</span><h1>미션 관리</h1><p>미션을 추가하고 순서를 정한 뒤 저장해 주세요.</p><p id="status" role="status" aria-live="polite"></p><form id="login" hidden><label>선생님 이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><section id="editor" hidden><div class="toolbar"><button id="add">＋ 미션 추가</button><button id="save">변경 사항 저장</button><button id="logout" class="secondary">로그아웃</button></div><p id="save-state">저장된 상태입니다.</p><div id="rows"></div></section></main><script type="module" src="admin.js"></script></body></html>
